# DigitalOcean App Platform spec: static site.
# Create the app from this spec in the DO dashboard (Apps > Create App > GitHub > davidendersby2019),
# or: doctl apps create --spec .do/app.yaml
# `name` must match the existing app exactly, or the deploy creates a second app. The deploy replaces
# the app's whole spec with this file, so settings changed in the DO dashboard (domains, region) must
# be mirrored here or they are lost.
name: davidendersby-2019
region: ams
domains:
  - domain: www.davidendersby.me
    type: PRIMARY
  - domain: davidendersby.me
    type: ALIAS
static_sites:
  - name: davidendersby-2019 # must match the existing component, or the update deletes it and adds a new one
    github:
      repo: Davetherave2010/davidendersby2019
      branch: master
      deploy_on_push: false # deploys come from the GitHub Actions workflow (.github/workflows/ci.yml)
    build_command: npm ci --legacy-peer-deps && npm run build
    output_dir: dist
    catchall_document: index.html
    envs:
      # Filled in by the deploy job (.github/workflows/ci.yml); the footer shows it.
      - key: VITE_APP_VERSION
        value: ${RELEASE_VERSION}
        scope: BUILD_TIME
